{% extends 'base.html' %}

{% block content %}


<div style="
display:flex;
justify-content:center;
align-items:center;
height:80vh;
">

    <div class="glass-box" style="
    width:450px;
    padding:30px;
    ">

        <h1 style="
        text-align:center;
        color:#00e5ff;
        ">
            Payment Gateway
        </h1>

        <p style="
        text-align:center;
        color:gold;
        font-size: 28px;
        font-weight: bold;
        ">
            Flight: {{ flight.flight_name }}
        </p>

        <p style="
        text-align:center;
        color:gold;
        margin-bottom:20px;
        font-size: 28px;
        font-weight: bold;
        ">
            Amount Payable: ₹{{ flight.price }}
        </p>
        <p style="color:#00ff99;">
        🔒 Secure Payment Gateway
        </p>

        <form method="post" id="paymentForm">
            {% csrf_token %}
            <input type="text"
                   name="card_name"
                   placeholder="Card Holder Name"
                   required
                   style="
                   width:100%;
                   padding:12px;
                   margin-bottom:15px;
                   border-radius:8px;
                   border:none;
                   ">
            <input type="text"
                   name="card_number"
                   placeholder="Card Number"
                   maxlength="16"
                   required
                   style="
                   width:100%;
                   padding:12px;
                   margin-bottom:15px;
                   border-radius:8px;
                   border:none;
                   ">
            <input type="password"
                   name="cvv"
                   placeholder="CVV"
                   maxlength="3"
                   required
                   style="
                   width:100%;
                   padding:12px;
                   margin-bottom:20px;
                   border-radius:8px;
                   border:none;
                   ">
            <button type="submit"
                    style="
                    width:100%;
                    padding:12px;
                    background:#00ff99;
                    border:none;
                    border-radius:10px;
                    font-weight:bold;
                    ">
                💳 Pay ₹{{ flight.price }}
            </button>
        </form>
        <div id="successPopup" style="
        display:none;
        position:fixed;
        top:0;
        left:0;
        width:100%;
        height:100%;
        background:rgba(0,0,0,0.8);
        z-index:9999;
        justify-content:center;
        align-items:center;
        ">
            <div style="
            background:white;
            padding:40px;
            border-radius:20px;
            text-align:center;
            width:350px;
        ">

                <h1 style="color:#00cc66;animation:bounce 1s infinite;font-size:32px">
                ✅Payment Successful
                </h1>
                <p style="
                color:black;
                font-size:18px;
                ">
                    Processing your ticket...
                </p>
            </div>
        </div>
        <style>
        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }
        </style>
        <script>
        document.getElementById("paymentForm").addEventListener("submit", function(e){
            e.preventDefault();
            document.getElementById("successPopup").style.display = "flex";
            setTimeout(() => {this.submit()}, 2000);
        });
        </script>

{% endblock %}
